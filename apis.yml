name: Purpose Green
description: >-
  Purpose Green is a Berlin-based sustainability consulting firm and 360-degree
  provider for sustainable real estate development, serving property owners and
  investors who manage multi-unit residential and commercial buildings. The
  company combines energy auditing (its Energy Light Report tool), ESG reporting,
  subsidy and grant consultation, renovation project management, and a web-based
  portfolio management portal (Green+ Portal) to help reduce a building's final
  energy demand by up to 80%. It is backed by Speedinvest and was added to the
  API Evangelist network as a portfolio lead; the company publishes web tools and
  a customer portal but no public developer API or documentation at this time.
